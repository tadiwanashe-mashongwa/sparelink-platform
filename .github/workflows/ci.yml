name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  platform-smoke-test:
    needs: validate-compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tadiwanashe-mashongwa/catalogue-service
          path: catalogue-service
      - uses: actions/checkout@v5
        with:
          repository: tadiwanashe-mashongwa/inventory-service
          path: inventory-service
      - uses: actions/checkout@v5
        with:
          repository: tadiwanashe-mashongwa/order-service
          path: order-service
      - uses: actions/checkout@v5
        with:
          repository: tadiwanashe-mashongwa/payment-service
          path: payment-service
      - name: Start backend platform services
        run: docker compose up -d --build postgres kafka keycloak catalogue-service inventory-service order-service payment-service
      - name: Wait for platform readiness
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            http://localhost:8080/realms/sparelink \
            http://localhost:8081/actuator/health \
            http://localhost:8082/actuator/health \
            http://localhost:8083/actuator/health \
            http://localhost:8084/actuator/health; do
            ready=false
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "$endpoint" > /dev/null; then
                ready=true
                break
              fi
              echo "Waiting for $endpoint"
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "Timed out waiting for $endpoint"
              exit 1
            fi
          done
      - name: Run successful payment lifecycle smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
